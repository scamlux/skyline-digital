<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="skyline.digital">
  <defs>
<radialGradient id="sun" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#FFC978"/>
      <stop offset="34%" stop-color="#FFAE5C"/>
      <stop offset="100%" stop-color="#E8517C"/>
    </radialGradient>
    <radialGradient id="aurora" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#E8517C" stop-opacity="0.42"/>
      <stop offset="78%" stop-color="#E8517C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E8517C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8517C" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FF5C8A"/>
      <stop offset="100%" stop-color="#E8517C" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="h-sky"><rect x="0" y="0" width="160" height="104"/></clipPath>
  </defs>
  <g clip-path="url(#h-sky)">
    <circle cx="80" cy="104" r="76" fill="url(#aurora)"/>
    <circle cx="80" cy="104" r="44" fill="url(#sun)"/>
  </g>
  <rect x="8" y="102" width="144" height="3" fill="url(#horizon)"/>
  <text x="184" y="118" font-family="Unbounded, 'Golos Text', system-ui, sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.5">
    <tspan fill="currentColor">skyline</tspan><tspan fill="#FFAE5C">.</tspan><tspan fill="currentColor">digital</tspan>
  </text>
</svg>
